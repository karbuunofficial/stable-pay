server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build files never change, so cache them for a year
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html (and the SPA fallback, which serves it) must always be revalidated. Otherwise browsers keep an
  # old copy after a deploy and keep running the previous JavaScript, which matters most for auth fixes.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
